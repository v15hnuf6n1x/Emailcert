[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emailcert-certgen"
version = "0.1.0"
description = "Personalized certificate generator from Canva templates (PNG/SVG) with DancingScript, 278 participants support"
readme = "emailcert/certgen/README.md"
authors = [{name = "Naresh Kumar S", email = "nareshkumarnkrs@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]
keywords = ["certificate", "certgen", "pandas", "pillow"]

[project.optional-dependencies]
svg = [
    "cairosvg>=2.7.0",
    "cairocffi>=1.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Repository = "https://github.com/NareshKumar-nrk/Emailcert"

[tool.setuptools.packages.find]
where = ["."]
include = ["emailcert*"]
exclude = ["events*", "tests*", "certificates*", "draft_test*", "certificates_demo*", "certificates_final_test*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
